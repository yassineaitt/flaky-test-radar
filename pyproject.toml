[project]
name = "flaky-test-radar"
version = "0.1.0"
description = "Detects flaky tests across CI runs from JUnit XML or Allure results, computes trends and renders a static HTML dashboard. Ships a reusable GitHub Actions workflow other repositories can call."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yassine Ait Tamarmoucht" }]
requires-python = ">=3.12"
keywords = ["flaky-tests", "junit", "allure", "test-analytics", "ci", "dashboard", "github-actions"]
dependencies = [
  "typer>=0.17",
  "rich>=14",
  "pydantic>=2.11",
  "jinja2>=3.1",
]

[project.scripts]
flaky-radar = "flaky_radar.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "mypy>=1.17",
  "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flaky_radar"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RET", "RUF", "ANN", "S", "T20", "PL"]
ignore = ["ANN401", "S101", "PLR2004", "PLR0913"]
per-file-ignores = { "tests/**" = ["S", "ANN"], "src/flaky_radar/cli.py" = ["T20"], "scripts/**" = ["T20", "S311"] }

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["flaky_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["flaky_radar"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]
